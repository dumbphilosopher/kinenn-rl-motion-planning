# KineNN-Informed SAC Hyperparameters (Thesis Table 6.6 & Algorithm 4)
algo: sac
mode: kinenn
total_timesteps: 25000
seed: 42
env:
  action_dt: 0.05
  max_steps: 240
  success_tolerance: 0.025
  reward_alpha: 10000.0
  randomize_target_orientation: true
kinenn:
  filter_steps: 35
  dh_update_freq: 32
  perturbation_std: 0.015
  ik_damping: 0.08
  ik_gain: 0.85
hyperparams:
  learning_rate: 0.0001
  learning_starts: 0
  batch_size: 256
  buffer_size: 50000
  gamma: 0.95
  tau: 0.01
  train_freq: 10
  gradient_steps: 5
  ent_coef: auto_0.1
  target_update_interval: 10
