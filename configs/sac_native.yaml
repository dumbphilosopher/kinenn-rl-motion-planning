# Native SAC Hyperparameters (Thesis Table 6.3)
algo: sac
mode: native
total_timesteps: 25000
seed: 42
env:
  action_dt: 0.05
  max_steps: 240
  success_tolerance: 0.025
  reward_alpha: 10000.0
  randomize_target_orientation: true
hyperparams:
  learning_rate: 0.0003
  learning_starts: 100
  batch_size: 256
  buffer_size: 50000
  gamma: 0.99
  tau: 0.005
  train_freq: 1
  gradient_steps: 1
  ent_coef: auto
  target_update_interval: 1
