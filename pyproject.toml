[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kinenn-rl"
version = "1.0.0"
description = "KineNN-Informed Reinforcement Learning (PPO & SAC) for 6-DoF ABB IRB 1200 Welding Station Motion Planning in MuJoCo"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Zain Lotiya", email = "lotiyazain@gmail.com" }]
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
  "mujoco>=3.1",
  "gymnasium>=0.29",
  "stable-baselines3>=2.3",
  "matplotlib>=3.8",
  "imageio>=2.34",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
